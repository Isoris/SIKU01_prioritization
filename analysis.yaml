  - A test cannot redefine a rule.
  - A result cannot redefine a rule.
  - Manuscript prose cannot redefine a rule.
  - Never patch derived results manually to force agreement with rule authority.
  - Historical artifacts are provenance only unless explicitly promoted after audit.
