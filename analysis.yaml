      / numpy 2.3.4: two independent canonical runs reproduce byte-identical output for all 20 declared outputs, and all
      20 now match artifact_manifest.tsv (see status_history: MANIFEST_HASH_DRIFT). A reviewer rerunning this capsule should
      see `run_all: OK` and `20/20 match, 0 mismatch, 0 missing`; anything else is a real finding, not noise.'
