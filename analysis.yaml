      08_source_data/routed_input/nucleotide_descriptors_by_pangenome_id_v01.tsv:
        grain: pangenome_id_x_pangenome_class
        n_rows: 3001
        content: per-family nucleotide/codon descriptor distribution summary (CDS length, GC3, CAI variants, Type IIS site
          counts; n/median/Q1/Q3 per descriptor)
      08_source_data/routed_input/protein_descriptors_by_pangenome_id_v01.tsv:
        grain: pangenome_id_x_pangenome_class
        n_rows: 3001
        content: per-family protein physicochemical descriptor distribution summary (length, MW, pI, charge at three pH
          values, GRAVY, instability, aliphatic index; n/median/Q1/Q3 per descriptor)
      08_source_data/routed_input/interpro_by_pangenome_id_v02.tsv:
        grain: pangenome_id
        n_rows: 1838
        content: per-family representative-locus domain/signal annotation summary (InterPro/Pfam/signature counts, signal
