      08_source_data/routed_input/host_similarity_by_pangenome_id_v01.tsv:
        grain: pangenome_id
        n_rows: 1838
        content: per-family representative-locus alignment identity against the six reference proteomes, with a per-host
          pass/fail flag and a summary flag
      08_source_data/routed_input/nonspecific_by_pangenome_id_v01.tsv:
        grain: pangenome_id
        n_rows: 1838
        content: per-family representative-locus local-window match counts against the same six proteomes, at finer grain
          than host_similarity above
      08_source_data/routed_input/epitope_by_pangenome_id_v01.tsv:
        grain: pangenome_id
        n_rows: 1838
        content: per-family representative-locus database peptide-match summary (hit/peptide counts, best identity/E-value,
