    - M0_FULL_LENGTH
    - M0_CONSERVATION
    - M2_TMH
    - M2_MW
    - M2_SILICA_Z
    - M2_CELLULOSE_LEN
    - M2_AEX_PI
    - M2_CEX_PI
    - M2_CDS_LEN
    freeze_requirement: Resolve and write every rule_id x sweep_id row before calculating any candidate-retention, final-pass,
      Jaccard, or manuscript-facing sensitivity outcome.
    conservation_sweep:
      derivation_population: M0_ENTRY_REFERENCE
      variable: conservation__median_conservation_hnorm
      method: Fit a reproducible KDE on the bounded 0-1 score distribution. Treat the highest-H.norm density mode, including
        an endpoint mode at 1.0, as the conserved mode. Resolve the nearest density antimode immediately to its left. Define
        five score-axis thresholds at 0%, 20%, 40%, 60%, and 80% of the interval from that antimode to the upper conserved-mode
        boundary; add the canonical 0.98 threshold explicitly. Do not use empirical member quantiles, because the H.norm
        distribution contains a large plateau at 1.0 and those quantiles can collapse to duplicate thresholds. If a defensible
        antimode cannot be resolved, invoke the documented fallback before outcome execution.
      operator_fixed: '>'
      canonical_reference: 0.98
    tmh_sweep:
      variable: surface__rep_tmh_count
      method: integer_support_0_to_observed_max
      observed_max_in_candidate_data_v02: 14
      canonical_reference: 2
      operator_fixed: <=
    other_numeric_hard_sweeps: Claude may select compact scientifically interpretable grids from measurement scale and predictor
      distribution, but must resolve/freeze them in the sweep contract before inspecting eligibility consequences. Two-sided
      rules should normally vary one boundary at a time rather than use a large Cartesian grid.
  stability:
    hard_gates: leave_one_rule_out
    additive_components: leave_one_component_out
    hard_loo_minimum_outputs:
