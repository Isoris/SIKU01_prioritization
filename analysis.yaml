      pinned environment to reproduce them byte-for-byte (06_reproducibility/ENVIRONMENT_NOTES_v01.md). Three ship as .tsv.gz
      because they are record-level, one row per sample rather than per family; the rest are already aggregated to one row
      per pangenome_id (or pangenome_id x pangenome_class). conform_heuristic_inputs merges a subset of these into 01_analysis_output/derived/ranking_inputs_by_pangenome_id_v01.tsv,
      which is a derived product, not a frozen input.
