      note: 'the validation layer does not re-evaluate rule predicates: LOO and LOCO read the production outcomes and recompute
        the same intersection and accumulation with one rule omitted. The perturbation test asserts that equivalence on
        all 9,162 candidate-route rows, so a drift between the ranking and its own sensitivity analysis fails a test instead
