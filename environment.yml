# The environment the results were produced and checked with.
#   conda env create -f environment.yml && conda activate siku01-prioritization
# The prioritization itself needs only python, pandas and numpy. R is needed only for `bash run_all.sh --full`.
# pandas must stay below 3: pandas 3 writes some decimal numbers with a different last digit, and two input-assembly
# columns (rep__gravy, rep__charge_pH_7_0) then no longer match the deposited table character for character.
name: siku01-prioritization
channels:
  - conda-forge
  - bioconda
dependencies:
  - python =3.11
  - pandas =2.3.3
  - numpy =2.3.4
  # ---- only for the R test suites in tests/r/ ----
  - r-base =4.3.3
  - r-dplyr
  - r-readr
  - r-tidyr
  - r-tibble
  - r-stringr
  - r-bio3d =2.4.4
  - bioconductor-biostrings =2.70.*
  - r-digest
